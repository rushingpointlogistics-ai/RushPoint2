<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RushPoint — Marketplace & Logistics App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/maroon-theme.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background: #2B0008;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #mobile-app-root {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #2B0008;
    }
    .mobile-app-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <div id="mobile-app-root">
    <!-- Rendered dynamically by MobileApp -->
  </div>

  <script src="js/api.js"></script>
  <script src="js/mobile-app.js"></script>
  <script>
    // Ensure API points to live Render cloud instance
    if (typeof API !== 'undefined') {
      API.baseUrl = "https://rushpoint2.onrender.com";
      localStorage.setItem('rp_api_endpoint', 'https://rushpoint2.onrender.com');
    }
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof MobileApp !== 'undefined' && typeof MobileApp.init === 'function') {
        MobileApp.init();
      }
    });
  </script>
</body>
</html>
